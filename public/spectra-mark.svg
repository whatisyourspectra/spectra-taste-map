      <stop offset="0%" stop-color="#9dc0ff" stop-opacity="0.96"/>
      <stop offset="36%" stop-color="#4f7fdd" stop-opacity="0.92"/>
      <stop offset="78%" stop-color="#14234d" stop-opacity="0.98"/>
