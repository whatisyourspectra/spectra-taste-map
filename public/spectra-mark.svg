<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">SPECTRA Mark</title>
  <desc id="desc">Minimal S mark with a spectral blue gradient for SPECTRA.</desc>
  <defs>
    <linearGradient id="bg" x1="16%" y1="8%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#0d1830"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#2b5cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#162752" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0a1124" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          0 0 0 0 0.30
          0 0 0 0 0.48
          0 0 0 0 1.00
          0 0 0 0.22 0"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="41" fill="none" stroke="#9bbcff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="64" cy="64" r="37" fill="url(#lens)"/>
  <circle cx="64" cy="64" r="37" fill="none" stroke="#7da5ff" stroke-opacity="0.2" stroke-width="8" filter="url(#softGlow)"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#dce7ff" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
